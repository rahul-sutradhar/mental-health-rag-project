<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Serenity Mindspace</title>
    <meta name="description" content="Get in touch with the Serenity Mindspace team.">
    <meta name="theme-color" content="#7A9B76">

    <link rel="stylesheet" href="static/css/main.css">
    <link rel="stylesheet" href="static/css/components.css">
    <script src="static/js/utils.js" defer></script>

    <style>
        body { padding-top: 80px; }
        @media(max-width:768px){ body{ padding-top:70px; } }

        .contact-page {
            padding: var(--space-3xl) 0 var(--space-4xl);
            min-height: 100vh;
            background: linear-gradient(180deg, var(--bg-primary) 0%, rgba(164,196,160,0.05) 100%);
        }

        .contact-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-2xl);
        }

        .contact-card {
            background: var(--bg-elevated);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            padding: var(--space-2xl);
        }

        .contact-item {
            padding: var(--space-md) 0;
            border-bottom: 1px solid var(--color-sand);
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        @media(max-width:900px){
            .contact-layout{ grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
    <header class="site-header" id="header">
        <nav class="nav-container">
            <a href="index.html" class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 10 C30 10 20 25 20 40 C20 55 30 65 40 75 C45 80 47 85 50 90 C53 85 55 80 60 75 C70 65 80 55 80 40 C80 25 70 10 50 10 Z M50 50 C40 50 35 45 35 40 C35 35 40 30 50 30 C60 30 65 35 65 40 C65 45 60 50 50 50 Z"/>
                </svg>
                <span>Serenity Mindspace</span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="faq.html" class="nav-link">FAQ</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <button class="dark-mode-toggle" data-action="toggle-dark" title="Toggle dark mode"><span data-dark-icon>🌙</span></button>
                <a href="login.html" class="btn btn-outline" id="navLoginBtn">Login</a>
                <a href="login.html?signup=true" class="btn btn-primary" id="navSignupBtn">Sign Up</a>
                <a href="dashboard.html" class="btn btn-outline" id="navDashBtn" style="display:none">Dashboard</a>
                <button class="btn btn-ghost" data-action="logout" id="navLogoutBtn" style="display:none">Logout</button>
            </div>

            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </nav>
    </header>

    <div class="contact-page">
        <div class="container">
            <div class="page-header" style="text-align:center; margin-bottom: var(--space-3xl);">
                <h1>Contact Us</h1>
                <p class="text-secondary" style="font-size: var(--text-lg);">We’re here to help you.</p>
            </div>

            <div class="contact-layout">
                <div class="contact-card">
                    <h3 style="margin-bottom: var(--space-lg);">Get in Touch</h3>

                    <div class="contact-item">
                        <strong>Email</strong>
                        <p class="text-secondary" style="margin: var(--space-xs) 0 0;">support@serenitymindspace.com</p>
                    </div>

                    <div class="contact-item">
                        <strong>Phone</strong>
                        <p class="text-secondary" style="margin: var(--space-xs) 0 0;">+91 9152987821</p>
                    </div>

                    <div class="contact-item">
                        <strong>Address</strong>
                        <p class="text-secondary" style="margin: var(--space-xs) 0 0;">India</p>
                    </div>

                    <div class="contact-item">
                        <strong>Crisis Support</strong>
                        <p class="text-secondary" style="margin: var(--space-xs) 0 0;">
                            iCall — 9152987821<br>
                            Vandrevala — 18602662345
                        </p>
                    </div>
                </div>

                <div class="contact-card">
                    <h3 style="margin-bottom: var(--space-lg);">Send a Message</h3>

                    <div class="form-group">
                        <label class="form-label" for="contactName">Full Name</label>
                        <input type="text" id="contactName" class="form-input" placeholder="Your name">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="contactEmail">Email</label>
                        <input type="email" id="contactEmail" class="form-input" placeholder="you@example.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="contactSubject">Subject</label>
                        <input type="text" id="contactSubject" class="form-input" placeholder="How can we help?">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="contactMessage">Message</label>
                        <textarea id="contactMessage" class="form-textarea" rows="6" placeholder="Type your message..."></textarea>
                    </div>

                    <button class="btn btn-primary btn-full btn-lg" onclick="submitContactForm()">Send Message</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function submitContactForm() {
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const subject = document.getElementById('contactSubject').value.trim();
            const message = document.getElementById('contactMessage').value.trim();

            if (!name || !email || !subject || !message) {
                showToast('Please fill all fields.', 'warning');
                return;
            }

            showToast('Message sent successfully!', 'success');
            document.getElementById('contactName').value = '';
            document.getElementById('contactEmail').value = '';
            document.getElementById('contactSubject').value = '';
            document.getElementById('contactMessage').value = '';
        }
    </script>
</body>
</html>
